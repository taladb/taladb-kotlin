# The TalaDB engine this package is built against.
#
#   ref     git ref of taladb/taladb that CI builds from — always for the host
#           library the unit tests load, and for the Android libraries too
#           until a release is pinned below
#   abi     the C ABI version (TALADB_FFI_ABI_VERSION) this package's JNI shim
#           is written for
#   version, url, sha256
#           the engine release whose archive is packed into published AARs,
#           via scripts/fetch-engine.sh
#
# .github/workflows/engine-bump.yml rewrites this file when the engine
# publishes a release. The shim calls taladb_last_error_code and
# taladb_watch_with_options, which v0.11.9 lacks although it carries ABI
# version 2, so v0.12.0 is the oldest engine release this package can pin.
ref=v0.12.1
abi=2
version=0.12.1
url=https://github.com/taladb/taladb/releases/download/v0.12.1/taladb-ffi-android-0.12.1.zip
sha256=2925c50d501b41a86c40067b783ab6c27509410f178a3fbe71fd128652770fd2
